[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-claim-verification-baselines"
version = "0.1.0"
description = "Baseline convencional (NLI + segmentacion de danio + fusion) para verificacion de reclamos de seguros vehiculares. No contiene la contribucion de tesis (Evidence Graph / GATv2)."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["pydantic>=2.6,<3", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
