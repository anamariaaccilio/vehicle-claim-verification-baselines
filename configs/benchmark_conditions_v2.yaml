source: user_supplied_thesis_table_2026_10_02
conditions:
  C0:
    category: Control
    description: Narrativa compatible + imagen original
    expected_label: SUPPORTED
    status: IMPLEMENTED
    modification: Ninguna; narrativa derivada de clases anotadas
  C1:
    category: Semántica
    description: Daño declarado incompatible con lo observado
    expected_label: SUSPICIOUS
    status: IMPLEMENTED
    modification: Negación explícita de una clase de daño realmente anotada
  C2:
    category: Semántica
    description: Sustitución por imagen de otro expediente
    expected_label: SUSPICIOUS
    status: IMPLEMENTED
    modification: Substitution from a different source group in the same split; not
      necessarily a visible contradiction
  C3:
    category: Forense
    description: Copy-move o splice localizado
    expected_label: SUSPICIOUS
    status: IMPLEMENTED
    modification: Localized 24x24 copy-move from annotated region to a region outside
      all original damage masks
  C4:
    category: Forense
    description: Inpainting o eliminación de daño
    expected_label: SUSPICIOUS
    status: IMPLEMENTED
    modification: OpenCV Telea inpainting of the smallest annotated damage polygon;
      realism/removal not human verified
  C5:
    category: Combinada
    description: Contradicción narrativa + manipulación visual
    expected_label: SUSPICIOUS
    status: IMPLEMENTED
    modification: C3 plus denial of an original annotated damage class, whose pixels
      remain unchanged
  C6:
    category: Ausencia
    description: Narrativa ausente
    expected_label: INSUFFICIENT
    status: IMPLEMENTED
    modification: narrative_text=null; imagen original conservada
  C7:
    category: Ausencia
    description: Imagen ausente
    expected_label: INSUFFICIENT
    status: IMPLEMENTED
    modification: image_path=null; narrativa C0 conservada
  C8:
    category: Control
    description: JPEG, redimensionado o recorte benigno
    expected_label: SUPPORTED
    status: IMPLEMENTED
    modification: JPEG quality=95; PSNR>=35 dB; the JPEG branch of the authorized
      OR taxonomy
  C9:
    category: Degradación
    description: Desenfoque o calidad insuficiente
    expected_label: INSUFFICIENT
    status: IMPLEMENTED
    modification: Gaussian blur de radio 0.15*min(width,height); emisión solo con
      varianza Laplaciana<=1
  C10:
    category: Estrés OOD
    description: Manipulación no vista durante el entrenamiento
    expected_label: OOD
    status: IMPLEMENTED
    modification: Localized RGB inversion inside annotated damage; test only, family
      absent from train/validation
